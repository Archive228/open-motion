<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Motion example</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: -apple-system, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(1300px 900px at var(--gx) var(--gy), color-mix(in srgb, var(--accent) 17%, transparent), transparent 62%),
      radial-gradient(1000px 760px at calc(100% - var(--gx)) 88%, color-mix(in srgb, var(--accent2) 11%, transparent), transparent 62%),
      var(--bg); }
  #grid { position: absolute; inset: -120px; opacity: .5;
    background-image: linear-gradient(color-mix(in srgb, var(--ink) 5%, transparent) 2px, transparent 2px),
                      linear-gradient(90deg, color-mix(in srgb, var(--ink) 5%, transparent) 2px, transparent 2px);
    background-size: 120px 120px; }
  #bar { position: absolute; left: 0; bottom: 0; height: 10px; width: 100%; background: var(--accent); transform-origin: 0 50%; }
  #note { position: absolute; right: 96px; top: 64px; font-size: 40px; color: var(--dim); letter-spacing: .01em; }
  .scene { position: absolute; inset: 0; display: none; padding: 0 96px; }
  .mask { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .08em; }
  .mask > span { display: inline-block; will-change: transform; }
  .kicker { font-size: 56px; font-weight: 600; color: var(--accent); letter-spacing: .04em; }
  .h1 { font-size: 168px; font-weight: 800; letter-spacing: -.035em; line-height: 1.02; }
  .h2 { font-size: 92px; font-weight: 750; letter-spacing: -.025em; }
  .rule { height: 10px; width: 520px; background: var(--accent); transform-origin: 0 50%; margin-top: 44px; border-radius: 5px; }

  #title, #next { display: none; flex-direction: column; justify-content: center; }
  #revenue { text-align: left; }
  #revenue .label { position: absolute; left: 96px; top: 200px; font-size: 72px; font-weight: 600; color: var(--dim); }
  #revenue .big { position: absolute; left: 84px; top: 296px; font-size: 440px; font-weight: 850; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; transform-origin: 0 60%; }
  #revenue .delta { position: absolute; left: 96px; top: 792px; font-size: 72px; font-weight: 700; color: var(--bg); background: var(--accent2); padding: 18px 40px; border-radius: 60px; transform-origin: 0 50%; }

  #chart .h2, #facts .h2 { position: absolute; left: 96px; top: 96px; }
  #plot { position: absolute; left: 96px; right: 96px; top: 280px; bottom: 150px; display: flex; align-items: flex-end; gap: 56px; border-bottom: 4px solid color-mix(in srgb, var(--ink) 22%, transparent); }
  .col { flex: 1; height: 100%; position: relative; }
  .col .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 18px 18px 0 0; background: color-mix(in srgb, var(--ink) 20%, transparent); }
  .col.last .fill { background: var(--accent); }
  .col .val { position: absolute; left: 0; right: 0; text-align: center; font-size: 76px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .col .lab { position: absolute; left: 0; right: 0; bottom: -84px; text-align: center; font-size: 46px; font-weight: 600; color: var(--dim); }

  #cards { position: absolute; left: 96px; right: 96px; top: 300px; display: flex; gap: 48px; }
  .card { flex: 1; padding: 96px 52px 104px; border-radius: 36px; background: color-mix(in srgb, var(--ink) 7%, transparent); border: 3px solid color-mix(in srgb, var(--ink) 12%, transparent); }
  .card .num { font-size: 150px; font-weight: 850; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card:nth-child(2) .num { color: var(--accent2); }
  .card:nth-child(3) .num { color: var(--accent); }
  .card .cap { margin-top: 34px; font-size: 56px; font-weight: 600; color: var(--dim); }

  #dots { display: flex; gap: 34px; margin-top: 64px; }
  #dots i { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); display: block; }
  #next .brand { position: absolute; right: 96px; bottom: 56px; font-size: 44px; font-weight: 600; color: var(--dim); }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <section class="scene" id="title"><div class="kicker"></div><div class="h1"></div><div class="rule"></div></section>
  <section class="scene" id="revenue"><div class="label"></div><div class="big"></div><div class="delta"></div></section>
  <section class="scene" id="chart"><div class="h2"></div><div id="plot"></div></section>
  <section class="scene" id="facts"><div class="h2"></div><div id="cards"></div></section>
  <section class="scene" id="next"><div class="kicker"></div><div class="h1"></div><div id="dots"></div><div class="brand"></div></section>
  <div id="note"></div>
  <div id="bar"></div>
</div>
<script>
// Everything on screen comes from content.json. seek(t) is a pure function of t: no timers, no CSS animations.
const $ = (sel, root = document) => root.querySelector(sel);
const clamp = (x) => Math.max(0, Math.min(1, x));
const p = (t, a, b) => clamp((t - a) / (b - a));                 // progress 0..1 between two times
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inCubic = (x) => x * x * x;
const outBack = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const words = (el, text) => { el.innerHTML = ''; return text.split(' ').map((w, i, all) => {
  const m = document.createElement('span'); m.className = 'mask';
  const s = document.createElement('span'); s.textContent = w; m.appendChild(s); el.appendChild(m);
  if (i < all.length - 1) el.appendChild(document.createTextNode(' '));
  return s; }); };
const num = (v, d) => (d ? v.toFixed(d) : Math.round(v).toLocaleString('en-US'));

let C, scenes = [];
const draw = {
  title(el, s, t) {
    t += 0.4;                                                   // the first frame already shows the title arriving
    const k = $('.kicker', el), e = outCubic(p(t, 0.1, 0.6));
    k.style.opacity = e; k.style.transform = `translateX(${-40 * (1 - e)}px)`;
    s.words.forEach((w, i) => { w.style.transform = `translateY(${112 * (1 - outExpo(p(t, 0.3 + 0.1 * i, 1.15 + 0.1 * i)))}%)`; });
    $('.rule', el).style.transform = `scaleX(${outExpo(p(t, 1.0, 1.9))})`;
  },
  revenue(el, s, t) {
    const l = $('.label', el), b = $('.big', el), d = $('.delta', el);
    l.style.opacity = outCubic(p(t, 0.05, 0.45));
    const g = outExpo(p(t, 0.25, 2.1));
    b.textContent = s.prefix + num(s.value * g, s.decimals) + s.suffix;
    b.style.opacity = outCubic(p(t, 0.2, 0.55)); b.style.transform = `scale(${0.9 + 0.1 * outExpo(p(t, 0.2, 1.4))})`;
    const k = p(t, 2.0, 2.55);
    d.style.opacity = clamp(k * 3); d.style.transform = `scale(${k <= 0 ? 0 : outBack(k)})`;
  },
  chart(el, s, t) {
    const h = $('.h2', el), e = outCubic(p(t, 0.05, 0.5));
    h.style.opacity = e; h.style.transform = `translateY(${30 * (1 - e)}px)`;
    const max = Math.max(...s.bars.map((b) => b.value)), room = 0.8;
    s.cols.forEach((c, i) => {
      const g = outExpo(p(t, 0.45 + 0.24 * i, 1.6 + 0.24 * i)), share = (s.bars[i].value / max) * room * g;
      c.fill.style.height = share * 100 + '%';
      c.val.style.bottom = `calc(${share * 100}% + 22px)`;
      c.val.textContent = s.prefix + num(s.bars[i].value * g, s.decimals) + s.suffix;
      c.val.style.opacity = clamp(g * 4);
      c.lab.style.opacity = outCubic(p(t, 0.3 + 0.24 * i, 0.8 + 0.24 * i));
    });
  },
  facts(el, s, t) {
    const h = $('.h2', el), e = outCubic(p(t, 0.05, 0.5));
    h.style.opacity = e; h.style.transform = `translateY(${30 * (1 - e)}px)`;
    s.cards.forEach((c, i) => {
      const a = outExpo(p(t, 0.35 + 0.32 * i, 1.15 + 0.32 * i));
      c.el.style.opacity = clamp(a * 2.5); c.el.style.transform = `translateY(${90 * (1 - a)}px)`;
      const it = s.items[i];
      c.num.textContent = num(it.value * outExpo(p(t, 0.45 + 0.32 * i, 2.1 + 0.32 * i)), 0) + it.suffix;
    });
  },
  next(el, s, t) {
    const k = $('.kicker', el), e = outCubic(p(t, 0.1, 0.6));
    k.style.opacity = e; k.style.transform = `translateX(${-40 * (1 - e)}px)`;
    s.words.forEach((w, i) => { w.style.transform = `translateY(${112 * (1 - outExpo(p(t, 0.3 + 0.1 * i, 1.15 + 0.1 * i)))}%)`; });
    s.dotEls.forEach((d, i) => { const q = p(t, 1.1 + 0.16 * i, 1.6 + 0.16 * i); d.style.transform = `scale(${q <= 0 ? 0 : outBack(q)})`; });
    $('.brand', el).style.opacity = outCubic(p(t, 1.7, 2.3));
  },
};

window.ready = fetch('content.json').then((r) => r.json()).then((c) => {
  C = window.CONTENT = c;
  window.SIZE = c.size; window.FPS = c.fps;
  window.DURATION = c.scenes.reduce((a, s) => a + s.seconds, 0);
  for (const [k, v] of Object.entries(c.colors)) document.documentElement.style.setProperty('--' + k, v);
  $('#note').textContent = c.note;
  for (const s of c.scenes) {
    const el = document.getElementById(s.id), sc = { ...s, el };
    if (s.kicker) $('.kicker', el).textContent = s.kicker;
    if (s.id === 'title' || s.id === 'next') sc.words = words($('.h1', el), s.title);
    else if (s.title) $('.h2', el).textContent = s.title;
    if (s.id === 'revenue') { $('.label', el).textContent = s.label; $('.delta', el).textContent = s.delta; }
    if (s.id === 'chart') sc.cols = s.bars.map((b, i) => {
      const col = document.createElement('div'); col.className = 'col' + (i === s.bars.length - 1 ? ' last' : '');
      col.innerHTML = '<div class="fill"></div><div class="val"></div><div class="lab"></div>';
      $('.lab', col).textContent = b.label; $('#plot').appendChild(col);
      return { fill: $('.fill', col), val: $('.val', col), lab: $('.lab', col) };
    });
    if (s.id === 'facts') sc.cards = s.items.map((it) => {
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = '<div class="num"></div><div class="cap"></div>';
      $('.cap', card).textContent = it.label; $('#cards').appendChild(card);
      return { el: card, num: $('.num', card) };
    });
    if (s.id === 'next') {
      sc.dotEls = Array.from({ length: s.dots }, () => $('#dots').appendChild(document.createElement('i')));
      $('.brand', el).textContent = c.scenes[0].kicker;
    }
    scenes.push(sc);
  }
});

window.seek = (t) => {
  const D = window.DURATION; t = Math.max(0, Math.min(D, t));
  const root = document.documentElement.style;
  root.setProperty('--gx', 30 + 22 * Math.sin(t * 0.33) + '%');
  root.setProperty('--gy', 28 + 12 * Math.cos(t * 0.27) + '%');
  $('#grid').style.transform = `translate(${-(t * 14) % 120}px, ${-(t * 8) % 120}px)`;
  $('#bar').style.transform = `scaleX(${t / D})`;
  let start = 0;
  scenes.forEach((s, i) => {
    const local = t - start, last = i === scenes.length - 1;
    const on = local >= 0 && (local < s.seconds || (last && local <= s.seconds));
    s.el.style.display = on ? (s.id === 'title' || s.id === 'next' ? 'flex' : 'block') : 'none';
    if (on) {
      draw[s.id](s.el, s, local);
      const out = last ? 0 : inCubic(p(local, s.seconds - 0.4, s.seconds));      // every scene but the last leaves
      s.el.style.opacity = 1 - out; s.el.style.transform = `translateY(${-50 * out}px)`;
    }
    start += s.seconds;
  });
};
</script>
</body>
</html>
